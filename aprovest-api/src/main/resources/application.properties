spring.application.name=aprovest
server.port=8080

# =====================================================================
# Banco de dados - Microsoft SQL Server
# O "npm run dev" descobre o SQL Server do computador e passa a conexão
# por variáveis de ambiente. Para rodar só a API, ajuste usuário e senha
# no arquivo application-local.properties (copie o .example).
# =====================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=aprovesttcc;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=
spring.config.import=optional:classpath:application-local.properties
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# As tabelas são criadas pelos scripts da pasta /database (o JPA não cria nem altera tabelas)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Usa os nomes de tabelas e colunas exatamente como estão no script (Usuario, idUsuario...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Endereço do front-end (React + Vite), liberado no CORS
app.cors.origens=http://localhost:5173,http://localhost:4173

spring.jackson.time-zone=America/Sao_Paulo
